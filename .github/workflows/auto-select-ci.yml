name: Auto Select CI

on:
  push:
    branches:
      - feature/auto-select-v0.1
  pull_request:

jobs:
  core-check:
    name: Core check and shot analysis tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check core
        run: cargo check --manifest-path src/core/Cargo.toml --no-default-features

      - name: Test shot analysis
        run: cargo test --manifest-path src/core/Cargo.toml --no-default-features shot_analysis
  macos-core:
    name: macOS core check and shot analysis tests
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-

      - name: Check core on macOS
        run: cargo check --manifest-path src/core/Cargo.toml --no-default-features

      - name: Test shot analysis on macOS
        run: cargo test --manifest-path src/core/Cargo.toml --no-default-features shot_analysis
